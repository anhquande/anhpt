name: anhpt
description: AnhPT - Your Voice-Guided Personal Trainer
publish_to: "none"

version: 0.8.2+14

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  yaml: ^3.1.3
  shared_preferences: ^2.5.3
  flutter_tts: ^4.2.5
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  record: ^6.1.2
  file_picker: ^10.3.3
  archive: 4.2.0
  crypto: ^3.0.6
  http: ^1.5.0
  video_player: ^2.10.0
  video_player_win: ^3.2.2
  win32: ^5.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
