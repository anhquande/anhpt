name: anhpt
description: AnhPT - Your Voice-Guided Personal Trainer
publish_to: "none"

version: 0.14.0+34

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  yaml: ^3.1.3
  shared_preferences: ^2.5.3
  flutter_tts: ^4.2.5
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  record: ^6.1.2
  file_picker: ^10.3.3
  image_picker: ^1.1.2
  archive: 4.2.0
  crypto: ^3.0.6
  http: ^1.5.0
  video_player: ^2.10.0
  video_player_win: ^3.2.2
  camera: 0.12.0+2
  # 0.7.4+6 explicitly adds androidx.concurrent:concurrent-futures:1.2.0,
  # fixing CallbackToFutureAdapter not found when CameraX is compiled with
  # recent Gradle/AGP versions.
  camera_android_camerax: 0.7.4+6
  camera_windows: 0.2.6+1
  win32: ^5.15.0
  package_info_plus: ^8.3.1
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/content/
