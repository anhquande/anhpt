quotes:
  - title: KEEP MOVING
    text: Consistency beats intensity. A short workout today still moves you forward.
  - title: ONE MORE STEP
    text: You do not need a perfect workout. You only need to start the next one.
  - title: SHOW UP
    text: Progress begins when you show up, even on the days when motivation is low.
  - title: BUILD THE HABIT
    text: The workout you repeat is more powerful than the workout you only plan.
  - title: SMALL WINS
    text: Every completed set is evidence that you are moving in the right direction.
  - title: KEEP YOUR PROMISE
    text: Train for the person you want to become, one session at a time.
