name: Bug Report
description: Report a defect or incorrect behavior in AnhPT
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please provide enough detail for the issue to be reproduced and verified.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps that reproduce the issue.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Windows
        - Android
        - iOS
        - Web
        - macOS
        - Linux
        - Unknown
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: AnhPT version
      placeholder: e.g. 0.10.0

  - type: input
    id: flutter_version
    attributes:
      label: Flutter version
      placeholder: Output of flutter --version

  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility
      options:
        - Always
        - Often
        - Sometimes
        - Once
        - Unable to reproduce again
    validations:
      required: true

  - type: dropdown
    id: regression
    attributes:
      label: Regression
      options:
        - Yes, this worked before
        - No
        - Unknown
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical
        - Major
        - Normal
        - Minor
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Paste relevant logs, stack traces, or console output.
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Add screenshots or screen recordings if they help explain the problem.

  - type: textarea
    id: additional
    attributes:
      label: Additional context

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I included reproducible steps or explained why reproduction is not currently possible.
          required: true
