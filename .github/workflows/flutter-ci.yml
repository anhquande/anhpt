name: Flutter CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release version
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          TITLE='${{ github.event.pull_request.title }}'
          if [[ "$TITLE" != feat:* && "$TITLE" != fix:* ]]; then
            echo "Non-release PR; version validation skipped."
            exit 0
          fi

          PUBSPEC_VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)
          SOURCE_VERSION=${PUBSPEC_VERSION%%+*}
          LATEST_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1 || true)

          if [[ -z "$LATEST_TAG" ]]; then
            echo "No previous release tag found; accepting pubspec version $SOURCE_VERSION."
            exit 0
          fi

          BASE_VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"

          if [[ "$TITLE" == feat:* ]]; then
            EXPECTED_VERSION="$MAJOR.$((MINOR + 1)).0"
          else
            EXPECTED_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi

          if [[ "$SOURCE_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "::error::pubspec.yaml version is $SOURCE_VERSION, but this PR title requires $EXPECTED_VERSION (latest release: $LATEST_TAG)."
            echo "Update pubspec.yaml before merging so local builds, package metadata and GitHub releases stay in sync."
            exit 1
          fi

          echo "Release version validated: $SOURCE_VERSION"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

  windows-build:
    name: Windows Build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        shell: powershell
        run: flutter config --enable-windows-desktop

      - name: Prepare Windows project
        shell: powershell
        run: |
          if (-not (Test-Path "windows\CMakeLists.txt")) {
            flutter create --platforms=windows --project-name anhpt .
          }

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows debug app
        run: flutter build windows --debug
