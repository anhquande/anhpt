name: Release Android & Windows

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write

concurrency:
  group: release-app
  cancel-in-progress: false

jobs:
  metadata:
    name: Determine release version
    if: >-
      github.event.pull_request.merged == true &&
      (startsWith(github.event.pull_request.title, 'feat:') ||
       startsWith(github.event.pull_request.title, 'fix:'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      build_number: ${{ steps.version.outputs.build_number }}
      apk_name: ${{ steps.version.outputs.apk_name }}
      windows_name: ${{ steps.version.outputs.windows_name }}
    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Determine release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          PUBSPEC_VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)
          CURRENT_VERSION=${PUBSPEC_VERSION%%+*}
          CURRENT_BUILD=${PUBSPEC_VERSION#*+}
          if [[ "$CURRENT_BUILD" == "$PUBSPEC_VERSION" ]]; then CURRENT_BUILD=0; fi
          LATEST_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1 || true)
          BASE_VERSION=${LATEST_TAG:+${LATEST_TAG#v}}
          BASE_VERSION=${BASE_VERSION:-$CURRENT_VERSION}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          TITLE='${{ github.event.pull_request.title }}'
          if [[ "$TITLE" == feat:* ]]; then
            VERSION="$MAJOR.$((MINOR + 1)).0"
          else
            VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          TAG="v$VERSION"
          BUILD_NUMBER=$((CURRENT_BUILD + GITHUB_RUN_NUMBER))
          git rev-parse "$TAG" >/dev/null 2>&1 && { echo "Tag $TAG already exists" >&2; exit 1; } || true
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "apk_name=anhpt-$TAG.apk" >> "$GITHUB_OUTPUT"
          echo "windows_name=anhpt-windows-$TAG.exe" >> "$GITHUB_OUTPUT"

  android:
    name: Build Android APK
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f android/gradlew ]]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/AnhPT-AndroidManifest.xml || true
            flutter create --platforms=android --project-name anhpt .
            cp /tmp/AnhPT-AndroidManifest.xml android/app/src/main/AndroidManifest.xml || true
          fi
      - name: Build release APK
        run: flutter build apk --release --build-name=${{ needs.metadata.outputs.version }} --build-number=${{ needs.metadata.outputs.build_number }}
      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk "${{ needs.metadata.outputs.apk_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: ${{ needs.metadata.outputs.apk_name }}

  windows:
    name: Build Windows installer
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Windows desktop
        shell: powershell
        run: flutter config --enable-windows-desktop
      - name: Prepare Windows project
        shell: powershell
        run: |
          if (-not (Test-Path "windows\CMakeLists.txt")) {
            flutter create --platforms=windows --project-name anhpt .
          }
      - run: flutter pub get
      - name: Build Windows release
        run: flutter build windows --release --build-name=${{ needs.metadata.outputs.version }} --build-number=${{ needs.metadata.outputs.build_number }}
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress
      - name: Create installer definition
        shell: powershell
        run: |
          @"
          [Setup]
          AppId={{B82F9A74-5AB7-4AF4-9D76-ANHPT2026}}
          AppName=AnhPT
          AppVersion=${{ needs.metadata.outputs.version }}
          DefaultDirName={localappdata}\Programs\AnhPT
          DisableProgramGroupPage=yes
          PrivilegesRequired=lowest
          OutputDir=.
          OutputBaseFilename=anhpt-windows-${{ needs.metadata.outputs.tag }}
          Compression=lzma2
          SolidCompression=yes
          CloseApplications=yes
          RestartApplications=yes
          UninstallDisplayIcon={app}\anhpt.exe

          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\AnhPT"; Filename: "{app}\anhpt.exe"

          [Run]
          Filename: "{app}\anhpt.exe"; Description: "Start AnhPT"; Flags: nowait
          "@ | Set-Content -Encoding UTF8 installer.iss
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: ${{ needs.metadata.outputs.windows_name }}

  release:
    name: Publish GitHub Release
    needs: [metadata, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ needs.metadata.outputs.tag }}"
          "release/${{ needs.metadata.outputs.apk_name }}"
          "release/${{ needs.metadata.outputs.windows_name }}"
          --repo "${{ github.repository }}"
          --target "${{ github.event.pull_request.merge_commit_sha }}"
          --title "AnhPT ${{ needs.metadata.outputs.tag }}"
          --generate-notes
