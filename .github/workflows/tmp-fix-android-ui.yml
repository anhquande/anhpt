name: Apply Android UI fixes

on:
  push:
    branches:
      - fix/android-health-dashboard-layout

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/android-health-dashboard-layout

      - name: Patch responsive Android UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          health = Path('lib/screens/health_screen.dart')
          text = health.read_text()
          old = """        LayoutBuilder(\n          builder: (context, constraints) => Stack(\n            alignment: Alignment.centerLeft,\n            children: [\n              const Row(\n                children: [\n                  Expanded(child: _RangeColor(Colors.orange)),\n                  Expanded(flex: 2, child: _RangeColor(Colors.green)),\n                  Expanded(child: _RangeColor(Colors.amber)),\n                  Expanded(child: _RangeColor(Colors.red)),\n                ],\n              ),\n              Positioned(\n                left: math.max(\n                  0,\n                  constraints.maxWidth * normalized - 7,\n                ),\n                child: const Icon(Icons.arrow_drop_down, size: 20),\n              ),\n            ],\n          ),\n        ),\n"""
          new = """        SizedBox(\n          height: 24,\n          child: LayoutBuilder(\n            builder: (context, constraints) => Stack(\n              clipBehavior: Clip.none,\n              children: [\n                const Positioned(\n                  left: 0,\n                  right: 0,\n                  top: 7,\n                  child: Row(\n                    children: [\n                      Expanded(child: _RangeColor(Colors.orange)),\n                      Expanded(flex: 2, child: _RangeColor(Colors.green)),\n                      Expanded(child: _RangeColor(Colors.amber)),\n                      Expanded(child: _RangeColor(Colors.red)),\n                    ],\n                  ),\n                ),\n                Positioned(\n                  left: math.max(\n                    0,\n                    math.min(\n                      constraints.maxWidth - 20,\n                      constraints.maxWidth * normalized - 10,\n                    ),\n                  ),\n                  top: 0,\n                  child: const Icon(Icons.arrow_drop_down, size: 20),\n                ),\n              ],\n            ),\n          ),\n        ),\n"""
          if old not in text:
              raise SystemExit('BMI bar block not found')
          health.write_text(text.replace(old, new, 1))

          home = Path('lib/screens/home_screen.dart')
          text = home.read_text()
          start_marker = "                  Wrap(\n                    spacing: 10,\n                    runSpacing: 10,\n                    children: [\n"
          end_marker = "                  const SizedBox(height: 18),\n"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('Dashboard actions block start not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('Dashboard actions block end not found')
          replacement = """                  LayoutBuilder(\n                    builder: (context, constraints) {\n                      final compact = constraints.maxWidth < 430;\n                      return Row(\n                        children: [\n                          Expanded(\n                            child: FilledButton.icon(\n                              onPressed: () => Navigator.push(\n                                context,\n                                MaterialPageRoute(\n                                  builder: (_) => WorkoutBuilderScreen(\n                                    controller: controller,\n                                  ),\n                                ),\n                              ),\n                              icon: const Icon(Icons.add),\n                              label: Text(compact ? 'New' : 'New workout'),\n                            ),\n                          ),\n                          const SizedBox(width: 8),\n                          Expanded(\n                            child: OutlinedButton.icon(\n                              onPressed: () => Navigator.push(\n                                context,\n                                MaterialPageRoute(\n                                  builder: (_) => BucketCatalogScreen(\n                                    controller: controller,\n                                  ),\n                                ),\n                              ),\n                              icon: const Icon(Icons.explore_outlined),\n                              label: Text(compact ? 'Browse' : 'Browse workouts'),\n                            ),\n                          ),\n                          const SizedBox(width: 4),\n                          PopupMenuButton<String>(\n                            tooltip: 'More ways to add',\n                            icon: const Icon(Icons.more_vert),\n                            onSelected: (value) {\n                              if (value == 'package') {\n                                _importPackage();\n                              } else if (value == 'yaml') {\n                                Navigator.push(\n                                  context,\n                                  MaterialPageRoute(\n                                    builder: (_) => WorkoutEditorScreen(\n                                      controller: controller,\n                                      importMode: true,\n                                    ),\n                                  ),\n                                );\n                              }\n                            },\n                            itemBuilder: (_) => const [\n                              PopupMenuItem(\n                                value: 'package',\n                                child: ListTile(\n                                  leading: Icon(Icons.unarchive_outlined),\n                                  title: Text('Import package'),\n                                  contentPadding: EdgeInsets.zero,\n                                ),\n                              ),\n                              PopupMenuItem(\n                                value: 'yaml',\n                                child: ListTile(\n                                  leading: Icon(Icons.code),\n                                  title: Text('Import YAML'),\n                                  contentPadding: EdgeInsets.zero,\n                                ),\n                              ),\n                            ],\n                          ),\n                        ],\n                      );\n                    },\n                  ),\n"""
          home.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/health_screen.dart lib/screens/home_screen.dart
          git commit -m "fix: keep Android health and dashboard actions visible"
          git push origin HEAD:fix/android-health-dashboard-layout
