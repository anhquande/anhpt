name: Render PlantUML diagrams

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**/*.puml'
      - '.github/workflows/render-plantuml-diagrams.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-plantuml:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Download PlantUML
        run: |
          curl -fsSL \
            -o plantuml.jar \
            https://github.com/plantuml/plantuml/releases/download/v1.2025.10/plantuml-1.2025.10.jar

      - name: Render PlantUML diagrams as SVG
        run: |
          find docs -type f -name '*.puml' -print0 | \
            xargs -0 -r java -jar plantuml.jar -tsvg

      - name: Commit rendered SVG diagrams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add 'docs/**/*.svg'

          if git diff --cached --quiet; then
            echo "No rendered diagram changes to commit."
          else
            git commit -m "docs: render PlantUML diagrams [skip ci]"
            git push
          fi
