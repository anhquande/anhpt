name: Apply recording relocation

on:
  push:
    branches:
      - feat/move-introduction-recording

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/move-introduction-recording
      - name: Apply changes
        run: python3 .github/scripts/move_intro_recording.py
      - name: Format and commit
        run: |
          dart format lib/screens/workout_builder_screen.dart lib/screens/workout_detail_screen.dart test/widget_test.dart test/coach_recording_test.dart || true
          git diff --check
          git rm .github/scripts/move_intro_recording.py .github/workflows/apply-recording-relocation.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/screens/workout_builder_screen.dart lib/screens/workout_detail_screen.dart test/widget_test.dart test/coach_recording_test.dart
          git commit -m "feat: move description recording into workout editor"
          git push origin HEAD:feat/move-introduction-recording
